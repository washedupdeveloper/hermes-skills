name: ci

# The gate is `python3 scripts/validate.py`: standard library only, so the same command a
# contributor runs is the one CI runs, on every OS, with nothing to install. The `nix gate`
# job is optional and marks the checks that need Nix (the formatter and this repository's
# own eval-tier assertions). Nothing in this workflow is required to use the library.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny everything at the workflow level, then grant per job: `contents: read` is all any of
# them needs, so a compromised action can read the tree and nothing else.
permissions: {}

# A superseded push has no verdict worth waiting for. Cancelling it also bounds how many
# copies of the same token-bearing workflow are alive at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The portable gate, on the operating systems the library claims to work on. This is the
  # claim: any system, any environment, a Python standard library.
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Two legs, and each one left out is named here so re-enabling it is one word.
      #
      # macOS: not in the list until this account has macOS runners. GitHub cancels
      # those jobs within a second, with no runner assigned and no step run, so the run
      # reports `cancelled` without having tested anything. Add macos-14 back when it
      # does; the code is standard library and claimed portable either way.
      #
      # ARM Linux: no `ubuntu-24.04-arm` leg. Nothing here is architecture-specific —
      # the gate is the standard library and `scripts/validate.py` — so the x86_64 and
      # Windows legs carry the claim. Add `ubuntu-24.04-arm` to this list to test it.
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: gate
        shell: bash
        # `RUNNER_OS`, not a matrix cell: a matrix built from `include` silently drops a
        # job when one cell omits a key, which is this repository's own workflow rule.
        run: |
          python3 scripts/validate.py || python scripts/validate.py

  # The code the skills ship, executed. Also the negative controls that prove each gate
  # rule fires: a check that only ever passes is indistinguishable from one that never ran.
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The same two legs as `validate`, left out for the same reasons; see the note there.
      # `ubuntu-24.04-arm` would be a third, and the tests are standard library too.
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: pytest
        shell: bash
        run: |
          PY=python3
          python3 --version >/dev/null 2>&1 || PY=python
          # The no-Nix leg: this job exists to prove the gate needs no Nix, so provisioning
          # pytest with Nix here would delete the thing being tested (docs/provisioning.md).
          "$PY" -m pip install --quiet pytest
          "$PY" -m pytest tests/ -q -p no:cacheprovider

  # Every mechanical claim in the prose, checked against the tree.
  audit:
    name: claim audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - run: python3 scripts/claim-audit.py

  # Optional: the maintainer checks that need Nix — the formatter, the eval-tier assertions,
  # and the same validate.py under a pinned interpreter.
  nix-gate:
    name: nix gate (optional)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31
      - name: nix flake check
        # A red X with no message is not a diagnosis. Run logs need a token to read; check
        # annotations do not, so the failing tail is emitted as one.
        run: |
          set -o pipefail
          if nix flake check --keep-going 2>&1 | tee /tmp/gate.log; then
            exit 0
          fi
          echo "::error::nix flake check failed; last lines below"
          tail -40 /tmp/gate.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

  # The spec tree this repository already carries, validated with the CLI it was written for.
  openspec:
    name: openspec
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31
      # The CLI is a package of this flake, so the version is the one `flake.lock` pins.
      - run: nix run .#openspec -- validate --all --strict

  # What each job took, so a gate nobody measures cannot quietly become slow.
  cost:
    name: cost
    if: always()
    needs: [validate, tests, audit, nix-gate, openspec]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: table
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ci-cost.py | tee -a "$GITHUB_STEP_SUMMARY"
