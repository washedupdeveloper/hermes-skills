name: ci

# This repository had NO CI. 174 files, 11 tests and a 13-claim auditor ran nowhere,
# so a push could break any of them and nothing said so — including the docs gate,
# which exists because the README had already drifted from reality twice.
#
# Five things are checked, and each is one the repo's own rules depend on:
#
#   gate    — `nix flake check`: the tree, the shipped artifact, and the two gates
#             below under one pinned toolchain. It is the authoritative one; see
#             nix/tests.nix for which tier each assertion belongs to.
#   tests   — the retained Python suite, on all three OSes. It is stdlib-only, so the
#             matrix needs nothing but pytest and is the portability claim, executed.
#   audit   — scripts/claim-audit.py, which exits 1 when any mechanical claim in the
#             prose is FALSE. That is the rule "a claim that can be measured MUST be
#             measured", enforced rather than stated.
#   setup   — tests/e2e/test_setup.sh against a STUBBED `hermes`, so the initializer's
#             merge path is exercised without touching a real config. It is a bash
#             script, so it runs where bash is the shell the script was written for.
#
# The `gate` job is the one that needs Nix. The other three deliberately do not:
# they run on a machine with nothing but Python and bash, which is the no-Nix path
# this repository promises its contributors. The properties that are pure functions
# of the tree live in the gate and nowhere else, so there is one owner per property.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny every permission at the workflow level and grant the one each job needs. The
# default is broader than this repository uses: `contents: read` here means a compromised
# action cannot push, open a PR, publish a package, or touch issues — it can read the
# tree and nothing else. Per-job grants are the part that keeps a future job from
# inheriting a scope nobody thought about.
permissions: {}

# A superseded push has no verdict worth waiting for. Cancelling it also bounds how many
# copies of the same token-bearing workflow are alive at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tree's own gate, under one pinned toolchain. `nix flake check` builds every
  # check in nix/checks.nix: the eval tier (milliseconds), the shipped artifact, and
  # the two Python/bash gates below run again here — so a property has one owner and
  # the other jobs remain the no-Nix path rather than a second implementation.
  gate:
    name: nix gate
    runs-on: ubuntu-24.04
    # the only scope any job here needs: read the tree, nothing else
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # composite action: no node runtime, so it is not part of the Node 20
      # deprecation. v31 is the current major, pinned to the commit that tag
      # pointed at — see the note in `tests` for why a tag is not enough.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31
      - name: nix flake check
        # A red X with no message is not a diagnosis. Run logs need a token to read; check
        # annotations do not, so the failing tail is emitted as one. Without this, a gate
        # failure on a runner is visible only to someone who can log in and read it.
        run: |
          set -o pipefail
          if nix flake check --keep-going 2>&1 | tee /tmp/gate.log; then
            exit 0
          fi
          msg=$(tail -c 1800 /tmp/gate.log \
                | sed -e 's/%/%25/g' -e 's/\r//g' \
                | awk 'BEGIN{ORS=""} NR>1{printf "%%0A"} {print}')
          echo "::error title=nix gate failed::${msg}"
          exit 1

  # The real product, loading the real tree. This is the only job that answers
  # "does Hermes actually load these skills?" rather than "is the tree shaped
  # right?" -- it installs Hermes and asks it, so a frontmatter field the real
  # parser rejects fails here and nowhere else.
  #
  # It is a separate job rather than a flake check because the product is not a
  # flake input of this repository, and pulling the whole agent into the gate
  # would make every contributor's `nix flake check` fetch it.
  live:
    name: live hermes
    runs-on: ubuntu-24.04
    # the only scope any job here needs: read the tree, nothing else
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: install hermes
        run: |
          # A rev, not a branch: `main` moves, so an unpinned install means this job
          # tests a different product tomorrow without any change here. Bumping it is
          # a one-line commit, and that is the point.
          nix profile install github:NousResearch/hermes-agent/548091836760a67e331b8f5643be8e5c08fae1e6#minimal
          # `nix profile install` lands in ~/.nix-profile/bin, which the nix
          # action does not put on PATH.
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: every catalog skill loads in the real hermes
        run: python scripts/verify-live.py

  # The portability guarantee, executed: nothing installed but the hash-pinned
  # pytest set, on a pinned image for each OS.
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # the only scope any job here needs: read the tree, nothing else
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      # checkout and setup-python must run on Node 24. Node 20 reached EOL in April
      # 2026 and was removed from the runners on 2026-09-23, so v4/v5 (the Node-20
      # majors) are wrong here.
      #
      # Pinned to a COMMIT, not a major. `@v7` is a mutable tag: whoever can move it
      # runs code here with this workflow's token, and no change to this repository
      # is needed. The comment above each pin names the version it was chosen for, so
      # a reader can tell how stale it is; `nix flake check` fails if any `uses:` is
      # not a 40-hex SHA, which is what keeps this from drifting back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      # Hash-pinned, not `pip install pytest`. An unpinned fetch resolves to whatever
      # PyPI serves at run time and executes it in this job; `--require-hashes` refuses
      # any artefact whose sha256 is not in the file, so a substituted release fails the
      # job instead of running in it. `--upgrade pip` is dropped for the same reason:
      # it is an unhashed download of the thing that does the verifying.
      - name: install pytest
        run: python -m pip install --require-hashes -r requirements-test.txt
      # Job logs need admin rights to download, but a step can emit GitHub
      # annotations and the checks API serves those unauthenticated for a public
      # repository. So the suite writes junit.xml and the next step turns each
      # failure into an annotation: an OS-specific failure is then readable without
      # a token. The annotation step is the enforcing one, so the job still fails.
      - name: run the suite
        run: python -m pytest tests/ -q --junitxml=junit.xml
        continue-on-error: true
      - name: report failing tests as annotations
        if: always()
        shell: python
        run: |
          import pathlib, sys, xml.etree.ElementTree as ET
          report = pathlib.Path("junit.xml")
          if not report.is_file():
              print("::error::junit.xml was not written — the suite did not run")
              sys.exit(1)
          bad = []
          for case in ET.parse(report).getroot().iter("testcase"):
              node = case.find("failure")
              if node is None:
                  node = case.find("error")
              if node is None:
                  continue
              label = f"{case.get('classname', '')}::{case.get('name', '')}"
              detail = (node.get("message") or "").replace("\n", " ")[:250]
              print(f"::error title={label}::{detail}")
              bad.append(label)
          print(f"::notice::failing tests: {len(bad)}")
          sys.exit(1 if bad else 0)

  # The prose gate, on one OS. It reads the tree and executes `setup.sh --check`
  # through subprocess, so a second platform would mostly repeat the same answer —
  # and where `setup.sh` IS platform-sensitive, the e2e job below already covers
  # macOS against a stub. One OS is enough here; macOS minutes count tenfold.
  audit:
    name: claim audit
    runs-on: ubuntu-24.04
    # the only scope any job here needs: read the tree, nothing else
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: audit the claims in the prose
        run: |
          # Failures become annotations as well as log lines. Job logs need admin
          # rights to download; annotations are served unauthenticated for a public
          # repository, so an audit that goes red stays diagnosable without a token.
          out=$(mktemp)
          if python scripts/claim-audit.py >"$out" 2>&1; then
            tail -n 3 "$out"
          else
            tail -n 25 "$out" | while IFS= read -r line; do
              echo "::error title=claim audit::$line"
            done
            exit 1
          fi

  # Deliberately NOT adopted, both rejected on cost rather than risk appetite:
  #
  #   step-security/harden-runner — an egress allowlist would have to name
  #     cache.nixos.org, channels.nixos.org, github.com, codeload.github.com and PyPI,
  #     and every Nix cache or flake input added later breaks the job with a failure
  #     that looks like a network fault. It is also another third-party action with
  #     `security-events: write`, which is the scope it exists to reduce.
  #   actions/cache on /nix/store — a poisoned cache is arbitrary code in every later
  #     run, and a Nix store cache is the highest-value thing in this workflow. The
  #     minutes it would save are not worth that.

  # The initializer, against a stub. ubuntu and macOS only: the test builds an
  # extensionless `hermes` stub and executes it through bash, and on a Windows
  # runner that depends on how Git Bash's exec layer treats a shebang file with no
  # extension. Unverified here, so it is not asserted — a job that fails for a
  # reason unrelated to this repository teaches people to ignore red.
  setup:
    name: setup.sh e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # the only scope any job here needs: read the tree, nothing else
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: exercise setup.sh against a stubbed hermes
        run: |
          # Annotated on failure for the same reason as the audit: the log is not
          # readable without admin rights, the annotations are.
          out=$(mktemp)
          if bash tests/e2e/test_setup.sh >"$out" 2>&1; then
            tail -n 3 "$out"
          else
            tail -n 25 "$out" | while IFS= read -r line; do
              echo "::error title=setup.sh e2e::$line"
            done
            exit 1
          fi

  # The gate's RULES, not the tree. An eval-tier assertion decides its outcome while the check
  # is being evaluated, and its derivation carries no inputs, so `nix flake check` cannot tell a
  # right tree from a wrong one. This job puts each forbidden state into the checkout and
  # requires the gate to fail; a rule that cannot fire is a rule that measures nothing.
  mutants:
    name: gate mutants
    runs-on: ubuntu-24.04
    # the only scope any job here needs: read the tree, nothing else
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: every rule fails on the state it forbids
        run: |
          # Annotated on failure for the same reason as the other jobs: the log needs admin
          # rights to read, and the annotations do not.
          out=$(mktemp)
          if python3 tests/e2e/test_gate_mutants.py >"$out" 2>&1; then
            tail -n 3 "$out"
          else
            tail -n 30 "$out" | while IFS= read -r line; do
              echo "::error title=gate mutants::$line"
            done
            exit 1
          fi

  # The specs are a gate input: a change that does not validate cannot land.
  # Node comes from the runner image, so this job needs no toolchain setup. The runner is an
  # image, not a floating label, and the CLI is an exact version: `ubuntu-latest` and `@1` are
  # both mutable references, which is what ADR 0005 exists to keep out (a council review found
  # both here).
  openspec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: install the spec CLI
        run: npm install -g --ignore-scripts @fission-ai/openspec@1.15.0
      - name: the specs validate
        run: openspec validate --all --strict
