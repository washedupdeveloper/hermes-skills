name: dependencies

# Keep the flake lock moving weekly. Dependabot owns the pinned actions and the
# Python test pins; this workflow owns the Nix input. A PR is the output, never
# an automatic merge.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependencies
  cancel-in-progress: false

jobs:
  flake-lock:
    name: refresh flake.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31
      - name: update and open a PR when the lock moved
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: deps/flake-lock
        run: |
          set -euo pipefail
          if git fetch origin "$BRANCH" 2>/dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "deps: refresh flake.lock"
          git push --force-with-lease origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --title "deps: refresh flake.lock" \
              --body "Weekly Nix flake lock refresh. CI must pass; a human merges this PR."
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "deps: refresh flake.lock" \
              --body "Weekly Nix flake lock refresh. CI must pass; a human merges this PR."
          fi
