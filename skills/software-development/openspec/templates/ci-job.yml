# Append under `jobs:` in the repository's CI workflow.
#
# Replace `<checkout-pin>` and `<nix-pin>` with the pins this repository already uses. A
# repository that pins actions by SHA must not gain an unpinned one.
#
# The CLI comes from the repository's flake, so CI runs the version the lockfile pins and the
# job needs no Node toolchain. A global install would be a second pin resolved at run time --
# the mutable reference ADR 0005 rejects. The runner is an image for the same reason.

  openspec:
    runs-on: ubuntu-24.04
    steps:
      - uses: <checkout-pin>
        with:
          persist-credentials: false
      - uses: <nix-pin>
      - name: the specs validate
        run: nix run .#openspec -- validate --all --strict
